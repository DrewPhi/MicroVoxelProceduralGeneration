[package]
name = "fbm"
version = "0.1.0"
edition = "2021"
default-run = "fbm"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
fastnoise-lite = { version = "1.1", features = ["f64"] }
rayon = "1.10"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "24.0.5"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
