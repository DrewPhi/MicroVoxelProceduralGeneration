[workspace]
resolver = "3"
members = ["crates/terrain-core", "crates/terrain-tools"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1

# Noise-heavy tests stay fast without a release build.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
