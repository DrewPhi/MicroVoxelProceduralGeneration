# Source terrain parameters: an implicit 3D density, solid where > 0:
#   density = h(x,z) - y + S(x,z) * n3(x, y*squash, z)
# h = 2D FBM heightfield (landscape), n3 = 3D FBM (overhangs), S = overhang
# strength (overhang_amplitude where the overhang mask is on).
#
# Edit and save; `scripts/terrain-preview.sh --watch` re-renders on every save.
# Any key can be overridden on the command line, e.g.
#   scripts/terrain-preview.sh --overhang-amplitude 24 --iso-yaw 45

# --- Landscape: 2D FBM heightfield (meters) ---
seed            = 1
octaves         = 8       # number of noise layers
base_wavelength = 1024    # size of the largest hills
amplitude       = 120     # heightfield stays within base_height ± amplitude
base_height     = 0
lacunarity      = 2.0     # frequency multiplier per octave
gain            = 0.5     # amplitude multiplier per octave (lower = smoother)
rotate_octaves  = true    # hide axis-aligned lattice artifacts

# --- Overhangs: 3D FBM displacement (meters) ---
overhang_amplitude       = 16    # max surface displacement; 0 = pure heightfield
overhang_wavelength      = 24    # size of the largest overhang features
overhang_octaves         = 4
overhang_lacunarity      = 2.0
overhang_gain            = 0.5
overhang_squash          = 2.0   # >1 horizontal ledges/strata, <1 vertical pillars
overhang_coverage        = 0.5   # fraction of land with overhangs (0..1)
overhang_mask_wavelength = 600   # size of overhang regions vs smooth regions

# --- 2D maps (height.png, shaded.png, overhangs.png) ---
center_x      = 0         # meters
center_z      = 0
extent        = 4096      # side length of the mapped square, meters
resolution    = 1024      # image size in pixels
voxel_size    = 0.25      # engine voxel size, meters
scan_step     = 0.5       # vertical search step for the top surface / overhangs
sun_azimuth   = 250       # degrees, 0 = from north (+z), clockwise toward east (+x)
sun_elevation = 35        # degrees above the horizon
contour       = 0         # contour line spacing in meters (0 = off)
out           = output/terrain

# --- Isometric 3D voxel view (iso.png) ---
iso               = true
iso_width         = 1600    # output width in pixels
iso_extent        = 64      # side of the rendered square in meters (0 = same as extent)
iso_max_columns   = 512     # beyond this, preview voxels become multiples of voxel_size
iso_yaw           = 225     # camera direction, degrees (0 = from north, 225 = from south-west)
iso_pitch         = 35.264  # camera elevation, degrees (35.264 = true isometric)
iso_exaggeration  = 1.0     # vertical scale (1 = true scale)
iso_shading       = auto    # face (true voxel look), smooth (density normals), auto
iso_shadows       = true
iso_mark_floaters = true    # magenta = voxels not connected to the ground in view

# --- Quadric fit (iso_fit.png, fit_error.png) over the iso region ---
# Each patch covers fit_cell_columns^2 voxel columns and a vertical band around
# the surface; inside it the terrain is F = min(q_1..q_n) of 3D quadrics,
# fitted by gradient descent.
fit              = true
fit_cell_columns = 8       # patch footprint in voxels (8 x 0.25 m = 2 m patches)
fit_quadratics   = 4       # n: max quadrics per patch (unused ones are dropped)
fit_steps        = 1500    # gradient-descent (Adam) steps per patch
fit_learning_rate = 0.1    # Adam step size (meters of density per coefficient)
fit_batch        = 256     # samples per step (0 = all)
fit_margin       = 2       # voxels of band above/below the source shell
fit_max_samples  = 6000    # samples used per patch for fitting (all are scored)
